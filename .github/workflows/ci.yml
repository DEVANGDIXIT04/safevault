name: SafeVault CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          # Copy example config
          cp safevault.conf.example safevault.conf
          sed -i 's/safevault@example.local/test@example.local/g' safevault.conf

          # Set up GPG directory as expected by safevault.conf
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          # Generate a throwaway GPG key for tests
          gpg --batch --passphrase '' --quick-generate-key test@example.local default default never
          
          mkdir -p keys
          gpg --armor --export test@example.local > keys/safevault.pub.asc


          # Ensure minio data directory exists and has right permissions
          mkdir -p minio-data
          chmod 777 minio-data

      - name: Start Docker Compose
        run: |
          docker compose up -d
          
          # Wait for Postgres to be fully seeded
          for i in {1..30}; do
            if docker exec safevault-postgres psql -U safevault -d fundwave -c "SELECT 1 FROM funds;" >/dev/null 2>&1; then
              echo "Postgres seeded!"
              break
            fi
            echo "Waiting for Postgres seed..."
            sleep 2
          done
          
          # Wait for MinIO
          for i in {1..30}; do
            if docker exec safevault-minio mc ready local >/dev/null 2>&1; then
              echo "MinIO ready!"
              break
            fi
            echo "Waiting for MinIO..."
            sleep 2
          done
          
          docker compose logs

      - name: Initialize MinIO Bucket
        run: |
          # Create bucket manually for test
          docker exec safevault-minio bash -c "mc alias set myminio http://localhost:9000 minioadmin minioadmin && mc mb myminio/safevault-backups"

      - name: Test Full Backup
        run: |
          ./scripts/backup-full.sh

      - name: Test Verify Drill
        run: |
          ./scripts/verify-drill.sh
