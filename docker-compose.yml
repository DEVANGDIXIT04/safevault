services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: safevault-postgres
    environment:
      POSTGRES_DB: fundwave
      POSTGRES_USER: safevault
      POSTGRES_PASSWORD: safevault_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./scripts:/scripts:ro
      - ./safevault.conf:/etc/safevault.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safevault -d fundwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: safevault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
